# Backend de la wiki en Render (Blueprint), plan gratis. El frontend sigue en Vercel.
# Pasos y variables de Vercel: README, sección "Despliegue".
services:
  - type: web
    name: wiki-en-equipo-backend
    runtime: node
    # Gratis: sin disco permanente y se duerme tras 15 minutos sin tráfico (despierta en ~1 minuto).
    # Por eso la base va en Turso y los archivos subidos dentro de la base (FILE_STORAGE=database).
    plan: free
    # La región más cercana a Centroamérica.
    region: virginia
    rootDir: backend
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm run db:generate && pnpm run build
    # Al arrancar, el servidor aplica en Turso las migraciones que falten (models/migrate-turso.ts); nunca borra datos.
    startCommand: pnpm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # pnpm 11 necesita Node 22 o más reciente.
      - key: NODE_VERSION
        value: "22"
      # Sin NODE_ENV=production: pnpm no instalaría TypeScript ni Prisma y la compilación fallaría.
      # Archivos subidos dentro de la base: el disco de Render gratis se borra en cada reinicio.
      - key: FILE_STORAGE
        value: database
      - key: FRONTEND_ORIGIN
        value: https://wiki-en-equipo.vercel.app
      # 4 MB: las subidas pasan por el servidor de Next en Vercel, que no acepta cuerpos de más de 4,5 MB.
      # Debe coincidir con NEXT_PUBLIC_MAX_UPLOAD_MB=4 en Vercel.
      - key: MAX_UPLOAD_BYTES
        value: "4194304"
      # Proxies delante del backend: el de Render y el servidor de Next en Vercel (IP real para el límite de inicios de sesión).
      - key: TRUST_PROXY
        value: "2"
      # Secretos: Render los pide al crear el Blueprint. Nunca se escriben aquí.
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: BOOTSTRAP_SECRET
        sync: false
