# Vercel publica la wiki desde la copia carlos388mendoza/wiki-en-equipo (la app de GitHub de Vercel está
# instalada en esa cuenta, no en la del repo principal). Este flujo adelanta el `main` de la copia hasta el
# `main` del repo principal cada 5 minutos; cada avance hace que Vercel publique el frontend y el backend.
# En el repo principal no hace nada (ver el `if`). Solo avanza sin forzar: si la copia se separa, falla y avisa.
name: Sincronizar la copia que publica Vercel

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sincronizar-copia
  cancel-in-progress: false

jobs:
  sincronizar:
    if: github.repository == 'carlos388mendoza/wiki-en-equipo'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Traer main del repo principal
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Es el botón "Sync fork" de GitHub. Si el cambio toca archivos de .github/workflows, GitHub no deja que
        # este flujo lo traiga: hay que presionar "Sync fork" en la copia a mano (ver CLAUDE.md).
        run: |
          result=$(gh api --method POST "repos/${{ github.repository }}/merge-upstream" -f branch=main)
          echo "$result"
          # "none": ya estaba al día; "fast-forward": la copia avanzó y hay que publicar.
          echo "avanzo=$(echo "$result" | jq -r ".merge_type != \"none\"")" >> "$GITHUB_OUTPUT"
        id: sync
      # Vercel no siempre publica al recibir el avance de la copia (el 21/10/2026 no lo hizo): se le pide con un
      # Deploy Hook del proyecto (secreto VERCEL_DEPLOY_HOOK de la copia). Si el aviso de Git también llega, Vercel
      # publica el mismo commit dos veces, sin problema.
      - name: Pedir a Vercel que publique
        if: steps.sync.outputs.avanzo == 'true'
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "Sin VERCEL_DEPLOY_HOOK: se espera al aviso de Git."; exit 0; fi
          curl -fsS -X POST "$HOOK" > /dev/null && echo "Publicación pedida a Vercel."
